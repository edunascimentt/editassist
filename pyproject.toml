[project]
name = "editassist"
version = "0.1.0"
description = "AI video editing engine: Claude Code orchestrates skills that drive ffmpeg, Whisper, ElevenLabs, Remotion and export editable timelines to Resolve, Premiere and After Effects."
requires-python = ">=3.11"
dependencies = [
  "opentimelineio>=0.18",
  "otio-fcp-adapter>=1.0",
  "otio-fcpx-xml-adapter>=1.0",
  "faster-whisper>=1.2",
  "opencv-python-headless>=4.10",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "pillow>=10.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
# automatic speaker diarization (PyTorch, ~2 GB); `uv sync --extra diarize`
diarize = ["pyannote.audio>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
ea = "editassist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
